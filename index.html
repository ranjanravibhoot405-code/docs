<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>4 GAP RUSH Stage 2</title><link rel="stylesheet" href="style.css"></head><body><main><h1>4 GAP RUSH</h1><p>Stage 2 · Multiplayer Race</p>
